name: 'base'

on:
  push:
    tags: [ v* ]
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default. A job that needs more asks for it explicitly, so a
# compromised action in the graph cannot write to the repository.
permissions:
  contents: read

jobs:
  # Reusable workflows are pinned to a commit SHA, not @main: a mutable ref means
  # CI can change under a PR that did not touch it, and the workflow runs with
  # this repository's token. This is fivexl/github-reusable-workflows main as of
  # 2026-07-06. Bump it deliberately - Dependabot's github-actions ecosystem
  # tracks it and will open the PR.
  #
  # Note the 1.0.0 tag is OLDER than this commit, so pinning to the tag would be
  # an unverified behaviour change rather than a stabilisation.
  python-job:
    uses: fivexl/github-reusable-workflows/.github/workflows/python-job.yml@f234ee717d5e5c56a314d8f4f701d3c85259b4e3
    with:
      python-version: "3.14"
      aws-default-region: "eu-central-1"
      working-directory: "src"

  terraform-job:
    uses: fivexl/github-reusable-workflows/.github/workflows/terraform-job.yml@f234ee717d5e5c56a314d8f4f701d3c85259b4e3
    with:
      terraform-version: "1.6.1"
      aws-default-region: "eu-central-1"

  # The reusable workflow's fmt and validate jobs run inside
  # hashicorp/terraform:latest and ignore its terraform-version input, so the
  # required_version floor declared in versions.tf is validated by nothing.
  # This job is what actually holds us to it.
  minimum-terraform:
    name: validate on the declared minimum Terraform
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.6.1
    steps:
      - uses: actions/checkout@v4
      - run: terraform init -backend=false
      - run: terraform validate -no-color

  # The reusable workflow has its terraform-docs job commented out, so README
  # staleness is otherwise caught only for contributors who installed pre-commit.
  terraform-docs:
    name: terraform-docs is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .,examples/basic
          config-file: .terraform-docs.yml
          fail-on-diff: true
