# terraform-docs output is version-sensitive: the table separator style changed
# between v0.20 and v0.24. CI runs terraform-docs/gh-actions@v1.4.1, which ships
# terraform-docs v0.20.0, so generate with that version locally too:
#   docker run --rm -v "$PWD":/src -w /src \
#     quay.io/terraform-docs/terraform-docs:0.20.0 \
#     markdown table --config .terraform-docs.yml --output-mode inject \
#     --output-file README.md .
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.104.0
    hooks:
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=false
      - id: terraform_fmt
      - id: terraform_validate
        # examples/ references the published registry module, which does not
        # exist until the first release is tagged. Drop this exclude after v1.0.0
        # is on the Terraform Registry.
        exclude: ^examples/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
